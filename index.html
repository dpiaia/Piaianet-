    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              brand: {
                yellow: '#FACC15',
                dark: '#0A0A0A',
                gray: '#171717',
                lead: '#333333',
                light: '#F5F5F5',
                "light-gray": '#E5E5E5',
              }
            }
          }
        }
      }
    </script>
    
    <style>
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0A0A0A; }
      .dark ::-webkit-scrollbar-track { background: #0A0A0A; }
      html:not(.dark) ::-webkit-scrollbar-track { background: #F5F5F5; }
      
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #FACC15; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #FACC15; }
      html:not(.dark) ::-webkit-scrollbar-thumb:hover { background: #333333; }
      
      body { 
        background-color: #F5F5F5; 
        color: #171717; 
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .dark body {
        background-color: #0A0A0A; 
        color: #F5F5F5; 
      }

      /* Fizzy Button Effect by Jamie Coulter inspiration */
      .fizzy-button {
        position: relative;
        transition: all 0.2s ease;
      }

      .fizzy-button .particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .fizzy-button .particle {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        opacity: 0;
        transform: scale(0);
      }

      .fizzy-button:hover .particle {
        animation: fizzy-particle 0.8s ease-out forwards;
      }

      @keyframes fizzy-particle {
        0% {
          transform: scale(0) translateY(0);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: scale(1.5) translateY(-40px) translateX(var(--x-offset));
          opacity: 0;
        }
      }

      /* Arrow slide effect */
      .fizzy-button .arrow {
        display: inline-block;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        transform: translateX(-10px);
        opacity: 0;
      }

      .fizzy-button:hover .arrow {
        transform: translateX(5px);
        opacity: 1;
      }

      .fizzy-button .label {
        transition: transform 0.3s ease;
      }

      .fizzy-button:hover .label {
        transform: translateX(-5px);
      }

      /* Glitch Animations (Keeping them if needed, but user asked for Fizzy) */
      @keyframes glitch-anim-1 {
        0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
        20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
        40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
        100% { clip-path: inset(30% 0 20% 0); transform: translate(1px, -1px); }
      }
      .animate-glitch-1 { animation: glitch-anim-1 0.4s infinite linear alternate-reverse; }

      @keyframes glitch-anim-2 {
        0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
        20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 1px); }
        100% { clip-path: inset(70% 0 10% 0); transform: translate(-1px, 1px); }
      }
      .animate-glitch-2 { animation: glitch-anim-2 0.4s infinite linear alternate-reverse; }

      /* TV Noise Animation */
      @keyframes tv-noise-anim {
        0% { transform: translate(0,0) }
        10% { transform: translate(-1%,-1%) }
        20% { transform: translate(-2%,1%) }
        30% { transform: translate(1%,-2%) }
        40% { transform: translate(-1%,2%) }
        50% { transform: translate(-2%,1%) }
        60% { transform: translate(2%,0) }
        70% { transform: translate(0,2%) }
        80% { transform: translate(-2%,0) }
        90% { transform: translate(1%,1%) }
        100% { transform: translate(1%,0) }
      }

      .noise-effect {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 5;
      }
      
      .noise-effect::after {
        content: "";
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.08;
        animation: tv-noise-anim 0.15s steps(2) infinite;
      }

      /* Timid Scrollbar */
      .timid-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
      }
      
      .timid-scrollbar:hover {
        scrollbar-color: rgba(250, 204, 21, 0.3) transparent;
      }

      .timid-scrollbar::-webkit-scrollbar {
        height: 4px;
      }
      
      .timid-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      
      .timid-scrollbar::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 10px;
      }
      
      .timid-scrollbar:hover::-webkit-scrollbar-thumb {
        background: rgba(250, 204, 21, 0.2);
      }

      .timid-scrollbar::-webkit-scrollbar-thumb:active {
        background: rgba(250, 204, 21, 0.5);
      }
    </style>
  </head>

    <div id="root"></div>

  </body>
